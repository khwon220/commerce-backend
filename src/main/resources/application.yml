spring:
  application:
    name: commerce-backend
  profiles:
    default: local
  jpa:
    # 스키마는 Flyway 가 소유한다. JPA 는 엔티티와 테이블이 맞는지만 검증한다.
    hibernate:
      ddl-auto: validate
    # 컨트롤러까지 영속성 컨텍스트를 열어 두지 않는다(지연 로딩이 뷰에서 쿼리를 내는 것 방지).
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3307/commerce?serverTimezone=UTC&characterEncoding=UTF-8
    username: commerce
    password: commerce
